# Ruff-Konfiguration — Lint-Baseline fuer phi-hex.
#
# Setzt die im CI-Workflow angekuendigte "Lint-Baseline" (ci.yml: war
# "non-blocking bis Lint-Baseline gesetzt"). `ruff check` ist ein
# blockierendes Gate. Default-Regelsatz (Pyflakes F + pycodestyle E4/E7/E9):
# faengt tote Importe, undefinierte Namen, ungenutzte Variablen sowie
# Mehrfach-Statements pro Zeile (E701/E702). Der Stack ist gegen diesen
# Default-Satz vollstaendig sauber (keine Ausnahmen noetig).
target-version = "py310"
line-length = 88
