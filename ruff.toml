# Ruff-Konfiguration — Lint-Baseline fuer phi-hex.
#
# Setzt die im CI-Workflow angekuendigte "Lint-Baseline" (ci.yml: war
# "non-blocking bis Lint-Baseline gesetzt"). Ab jetzt ist `ruff check` ein
# blockierendes Gate. Default-Regelsatz (Pyflakes F + pycodestyle E4/E7/E9):
# faengt tote Importe, undefinierte Namen, ungenutzte Variablen.
#
# Bewusst NICHT aktiviert (Projekt-Stilentscheid, keine Korrektheits-/
# Security-Relevanz):
#   E701/E702 — kompakte einzeilige if/return bzw. ';'-getrennte Statements
#   in den JSON-`clean()`-Serialisierern und der Acklam-_norm_ppf-Approximation.
#   Diese Form ist im gesamten Stack konsistent und absichtlich gewaehlt.
target-version = "py310"
line-length = 88

[lint]
ignore = ["E701", "E702"]
